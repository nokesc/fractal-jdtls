# SPDX-License-Identifier: Apache-2.0
# Releases a pushed tag v<release> (design §2, §9): check the tag against pin.json, build,
# run the full gate, then create a draft release, attach the zip and publish it.
# Only Chris pushes tags. With immutable releases on, publishing locks the release and its zip,
# which is why the zip is attached to the draft first.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # create the release and attach the zip
    env:
      TAG: ${{ github.ref_name }}
      # The repository's own mise.toml pins the toolchain; trust it in this checkout only.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # workmux is a developer tool mise.toml pins; the release doesn't use it, so don't install it.
      MISE_DISABLE_TOOLS: workmux
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (mise.toml, without workmux)
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.9.5
          install: true
          cache: false # a release builds from nothing cached

      - name: Set up the Python environment
        run: mise run setup

      # 1. The tag must be v + pin.json's release, with release notes; then build.
      - name: Check the tag against pin.json
        id: tag
        run: mise run release:check-tag -- "$TAG"

      - name: Build the release zip
        run: mise run release:zip

      # 2. The full gate: the agent build and JUnit tests, the unit tests, the zip, and the
      #    integration suite against real JDT LS (needs network; no Maven cache yet).
      - name: Run the release gate
        run: mise run validate

      - name: Show the zip
        env:
          ZIP: ${{ steps.tag.outputs.zip }}
        run: |
          sha256sum "$ZIP"
          mise exec -- python -m zipfile -l "$ZIP"

      # 3-5. Draft, attach, publish.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.tag.outputs.release }}
          NOTES: ${{ steps.tag.outputs.notes }}
        run: >-
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "fractal-jdtls $RELEASE" --notes-file "$NOTES"

      - name: Attach the zip
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.tag.outputs.zip }}
        run: gh release upload "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

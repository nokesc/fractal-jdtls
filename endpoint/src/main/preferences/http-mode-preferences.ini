# Eclipse preference defaults for HTTP mode (design §11 "Keeping in step with the disk"). bin/jdtls passes this file
# as -Declipse.pluginCustomization in HTTP mode only. Equinox reads it once, at startup, as defaults: nothing here is
# written to the workspace, so a later plain-mode start on the same -data doesn't see it.
#
# Lightweight auto-refresh refreshes a file that something reads while it's out of sync, behind the endpoint's fixed
# points: with it on, fixed points found fewer files changed than were written (HTTP-FINDINGS question 5).
org.eclipse.core.resources/refresh.lightweight.enabled=false
